<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBEC — Students</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben&display=swap" />
    <script src="../assets/vendor/jszip-3.10.1.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-mount"></div>

        <div class="main-content">
            <header class="topbar">
                <button class="btn btn-ghost btn-icon hamburger" id="hamburger">☰</button>
                <div style="flex:1;">
                    <div class="topbar-title">Students</div>
                    <div class="topbar-subtitle">PreBoard Examination Record</div>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-secondary" id="btn-import-students">📂 Import CSV/Excel</button>
                </div>
            </header>

            <main class="page-content xl-page">
                <div id="student-sheet"></div>
            </main>
        </div>
    </div>

    <!-- Bulk Import Modal -->
    <div class="modal-overlay hidden" id="modal-import">
        <div class="modal">
            <div class="modal-header">
                <span style="font-size:20px;">📂</span>
                <h3 id="modal-import-title">Import Students</h3>
                <button class="modal-close" id="modal-import-close">✕</button>
            </div>
            <div class="modal-body">
                <div class="drop-zone" id="import-dropzone">
                    <div class="drop-icon">📄</div>
                    <h4>Click to upload or drag and drop</h4>
                    <p class="text-muted">.xlsx, .xls, or .csv (PreBoard record template, or headers: Name, Student ID, Program, Year, Section)</p>
                    <input type="file" id="inp-import-file" accept=".xlsx, .xls, .csv" class="hidden" />
                </div>
                <div id="import-preview" class="hidden mt-16 text-sm"
                    style="background:var(--bg-hover);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);">
                    <span id="import-filename" class="fw-600"></span> (<span id="import-rowcount"></span> rows ready to
                    import)
                    <div id="import-skipped" class="text-muted"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-import-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-import-btn" disabled>Upload & Import</button>
            </div>
        </div>
    </div>


    <div id="toast-container"></div>

    <script type="module">
        import { requireAuth, logout } from "../js/auth.js";
        import { renderSidebar } from "../js/sidebar.js";
        import { initSidebar, showToast, setButtonLoading } from "../js/ui.js";
        import { escapeHtml, confirmStudentAction } from "../js/student-actions.js";
        import { parseRoster, workbookSheets, importRoster } from "../js/roster-import.js";
        import { lucideIcon } from "../js/lucide-icons.js";
        import { mountStudentSheet } from "../js/student-sheet.js";
        import { db } from "../js/firebase-config.js";
        import { logActivity } from "../js/audit.js";
        import {
            collection, getDocs, updateDoc, doc, serverTimestamp, query, where, onSnapshot, writeBatch, deleteField, getDocsFromServer
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const user = await requireAuth("teacher");
        document.getElementById("sidebar-mount").innerHTML = renderSidebar("students", user);
        document.getElementById("user-email-display").textContent = user.name || user.email;
        document.getElementById("user-avatar").textContent = (user.name || user.email)[0].toUpperCase();
        document.getElementById("logout-btn").addEventListener("click", logout);
        initSidebar();

        // Archive hides the row from the sheet and the mobile roster; records stay.
        async function archiveStudent(student) {
            if (!await confirmStudentAction(student, "archive")) return;
            try {
                await updateDoc(doc(db, "students", student._id), { isArchived: true, updatedAt: serverTimestamp() });
                await logActivity(user, "ARCHIVE_STUDENT", `Archived student: ${student.name}`, {
                    entityType: "student", entityId: student._id
                });
                showToast("Student archived.", "success");
            } catch (err) {
                showToast("Error archiving student: " + escapeHtml(err.message), "error");
            }
        }

        mountStudentSheet({
            mount: document.getElementById("student-sheet"), user, db, logActivity, showToast,
            removeStudent: archiveStudent, removeLabel: "Archive", removeIcon: lucideIcon("trash-2"),
            templateUrl: "../assets/templates/preboard-record.xlsx",
            api: { collection, doc, query, where, onSnapshot, updateDoc, writeBatch, serverTimestamp, deleteField, getDocs, getDocsFromServer }
        });

        // ─── Bulk Import ──────────────────────────────────────────────
        const dropzone = document.getElementById("import-dropzone");
        const fileInput = document.getElementById("inp-import-file");
        let importData = null;

        function openImportModal() {
            document.getElementById("modal-import").classList.remove("hidden");
            resetImport();
        }

        function closeImportModal() {
            document.getElementById("modal-import").classList.add("hidden");
            resetImport();
        }

        function resetImport() {
            fileInput.value = "";
            importData = null;
            document.getElementById("import-preview").classList.add("hidden");
            document.getElementById("import-filename").textContent = "";
            document.getElementById("import-rowcount").textContent = "";
            document.getElementById("import-skipped").innerHTML = "";
            document.getElementById("modal-import-btn").disabled = true;
        }

        document.getElementById("btn-import-students").addEventListener("click", openImportModal);
        document.getElementById("modal-import-close").addEventListener("click", closeImportModal);
        document.getElementById("modal-import-cancel").addEventListener("click", closeImportModal);
        document.getElementById("modal-import").addEventListener("click", (e) => {
            if (e.target === document.getElementById("modal-import")) closeImportModal();
        });

        dropzone.addEventListener("click", () => fileInput.click());
        dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
        dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
        dropzone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropzone.classList.remove("dragover");
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const { students, skipped } = parseRoster(workbookSheets(XLSX, workbook));
                    if (students.length === 0) {
                        throw new Error("No students found. Use the PreBoard record template or a sheet with Name and Student ID columns.");
                    }
                    importData = students;

                    document.getElementById("import-preview").classList.remove("hidden");
                    document.getElementById("import-filename").textContent = file.name;
                    document.getElementById("import-rowcount").textContent = students.length;
                    document.getElementById("import-skipped").innerHTML = skipped.length
                        ? `<div class="fw-600 mt-8">${skipped.length} row(s) will be skipped:</div><ul style="margin:4px 0 0 18px;">` +
                            skipped.map(s => `<li>${escapeHtml(s.name)}: ${escapeHtml(s.reason)} (${escapeHtml(s.where)})</li>`).join("") + "</ul>"
                        : "";
                    document.getElementById("modal-import-btn").disabled = false;
                } catch (err) {
                    showToast(err.message || "Failed to parse file.", "error");
                    resetImport();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById("modal-import-btn").addEventListener("click", async () => {
            if (!importData || importData.length === 0) return;

            const btn = document.getElementById("modal-import-btn");
            setButtonLoading(btn, true, `Importing ${importData.length} records…`);

            try {
                const { created, updated } = await importRoster({
                    db, students: importData, uid: user.uid,
                    api: { collection, doc, getDocs, writeBatch, serverTimestamp, deleteField }
                });
                await logActivity(user, "IMPORT_STUDENTS", `Imported ${importData.length} students`, {
                    entityType: "student", count: importData.length, created, updated
                });
                showToast(`Imported ${importData.length} students (${created} new, ${updated} updated).`, "success");
                closeImportModal();
            } catch (err) {
                console.error(err);
                showToast("Import failed: " + err.message, "error");
            } finally {
                setButtonLoading(btn, false);
            }
        });
    </script>
</body>

</html>
