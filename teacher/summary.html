<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBEC — Summary & Reports</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../assets/vendor/jszip-3.10.1.min.js"></script>
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-mount"></div>

        <div class="main-content">
            <header class="topbar">
                <button class="btn btn-ghost btn-icon hamburger" id="hamburger">☰</button>
                <div style="flex:1;">
                    <div class="topbar-title">Summary & Reports</div>
                    <div class="topbar-subtitle">Record scores and view analytics</div>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-secondary" id="btn-export" disabled>Export Excel class record</button>
                </div>
            </header>

            <main class="page-content">
                <div id="class-record-mount"></div>

                <!-- Exam Selector -->
                <div class="card mb-24" style="margin-bottom:24px;">
                    <div class="card-body"
                        style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;align-items:flex-end;">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Select Subject</label>
                            <select class="form-control" id="sel-subject">
                                <option value="">— All Subjects —</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="ESAS">ESAS</option>
                                <option value="Professional EE">Professional EE</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Select Exam</label>
                            <select class="form-control" id="sel-exam" disabled>
                                <option value="">— Select a subject first —</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" id="btn-load-exam" disabled>Load Exam</button>
                    </div>
                </div>

                <!-- Analytics cards (shown after exam is loaded) -->
                <div id="analytics-section" class="hidden">
                    <div class="stat-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:24px;"
                        id="analytics-cards">
                        <div class="stat-card">
                            <div class="stat-icon blue">👥</div>
                            <div class="stat-info">
                                <div class="stat-value" id="an-total">—</div>
                                <div class="stat-label">Students</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon teal">📊</div>
                            <div class="stat-info">
                                <div class="stat-value" id="an-avg">—</div>
                                <div class="stat-label">Average Score</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">🏆</div>
                            <div class="stat-info">
                                <div class="stat-value" id="an-high">—</div>
                                <div class="stat-label">Highest</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon red">📉</div>
                            <div class="stat-info">
                                <div class="stat-value" id="an-low">—</div>
                                <div class="stat-label">Lowest</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon yellow">✅</div>
                            <div class="stat-info">
                                <div class="stat-value" id="an-pass">—</div>
                                <div class="stat-label">Pass Rate</div>
                            </div>
                        </div>
                    </div>

                    <!-- Score Table -->
                    <div class="section-header mb-16">
                        <h2 id="table-exam-title">Exam Scores</h2>
                        <div class="toolbar" style="margin-bottom:0;">
                            <div class="search-box" style="min-width:200px;">
                                <span class="search-icon">🔍</span>
                                <input class="form-control" id="search-students" placeholder="Search students…" />
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Student ID</th>
                                        <th>Year</th>
                                        <th>Section</th>
                                        <th>Percentage (Set A)</th>
                                        <th>Percentage (Set B)</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="scores-tbody">
                                    <tr>
                                        <td colspan="8">
                                            <div class="empty-state">
                                                <div class="empty-icon">📊</div>
                                                <h4>No data</h4>
                                                <p>Select and load an exam to enter scores</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { requireAuth, logout } from "../js/auth.js";
        import { renderSidebar } from "../js/sidebar.js";
        import { initSidebar, showToast, setButtonLoading, debounce } from "../js/ui.js";
        import { getSettings } from "../js/settings.js";
        import { db } from "../js/firebase-config.js";
        import { logActivity } from "../js/audit.js";
        import { mountClassRecord, loadClassRecordData, canReadExam, timestamp, portalPercentages } from "../js/class-record.js";
        import { escapeHtml, normalizeStudent, filterStudents, studentSnapshot } from "../js/student-actions.js";
        import {
            collection, getDocs, setDoc, doc,
            serverTimestamp, query, where, onSnapshot, getDocsFromServer
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const user = await requireAuth("teacher");
        const settings = await getSettings();
        const PASSING_SCORE = settings.passingScore;

        document.getElementById("sidebar-mount").innerHTML = renderSidebar("summary", user);
        document.getElementById("user-email-display").textContent = user.name || user.email;
        document.getElementById("user-avatar").textContent = (user.name || user.email)[0].toUpperCase();
        document.getElementById("logout-btn").addEventListener("click", logout);
        initSidebar();
        let allStudents = [];
        let currentExam = null;
        let resultsMap = {};    // studentId -> { scoreA, scoreB }
        let unsubResults = null;

        function isOwnedByCurrentTeacher(record = {}) {
            return canReadExam(record, user);
        }

        // ─── Load students ─────────────────────────────────────────────
        try {
            const snap = await getDocs(collection(db, "students"));
            allStudents = snap.docs.map(d => normalizeStudent({ ...d.data(), _id: d.id }))
                .sort((a, b) => a.name.localeCompare(b.name));
        } catch (error) {
            showToast("Students could not be loaded. Reload to retry.", "error");
        }

        mountClassRecord({
            mount: document.getElementById("class-record-mount"),
            exportButton: document.getElementById("btn-export"), user, logActivity, showToast,
            templateUrl: "../assets/templates/preboard-record.xlsx",
            loadExams: async () => (await getDocsFromServer(collection(db, "exams"))).docs.map(d => ({ ...d.data(), _id: d.id })),
            loadRecords: selections => loadClassRecordData({ db, selections, user, api: { collection, query, where, getDocsFromServer } })
        });

        // ─── Subject → Exam chain ──────────────────────────────────────
        const selSubject = document.getElementById("sel-subject");
        const selExam = document.getElementById("sel-exam");
        const btnLoad = document.getElementById("btn-load-exam");

        selSubject.addEventListener("change", async () => {
            const subject = selSubject.value;
            selExam.innerHTML = `<option value="">Loading…</option>`;
            selExam.disabled = true;
            btnLoad.disabled = true;

            if (!subject) { selExam.innerHTML = `<option value="">— Select a subject first —</option>`; return; }

            const q = query(collection(db, "exams"), where("subject", "==", subject));
            let examDocs = (await getDocs(q)).docs;

            // Teachers only see their own exams. Supports web-created and Android-created exam ownership fields.
            if (user.role !== "admin") {
                examDocs = examDocs.filter(d => isOwnedByCurrentTeacher(d.data()));
            }

            examDocs.sort((a, b) => {
                const aTime = a.data().createdAt?.toMillis ? a.data().createdAt.toMillis() : new Date(a.data().createdAt || 0).getTime();
                const bTime = b.data().createdAt?.toMillis ? b.data().createdAt.toMillis() : new Date(b.data().createdAt || 0).getTime();
                return bTime - aTime;
            });

            if (examDocs.length === 0) {
                selExam.innerHTML = `<option value="">No exams found for ${subject}</option>`;
                return;
            }
            selExam.innerHTML = `<option value="">— Choose an exam —</option>` +
                examDocs.filter(d => d.data().deletedAt == null && !d.data().isArchived)
                    .map(d => `<option value="${escapeHtml(d.id)}" data-name="${escapeHtml(d.data().examName || d.data().name || d.id)}">${escapeHtml(d.data().examName || d.data().name || d.id)}</option>`).join("");
            selExam.disabled = false;
        });

        selExam.addEventListener("change", () => {
            btnLoad.disabled = !selExam.value;
        });

        btnLoad.addEventListener("click", async () => {
            const examId = selExam.value;
            const examName = selExam.options[selExam.selectedIndex].dataset.name;
            if (!examId) return;

            setButtonLoading(btnLoad, true, "Loading…");

            try {
                const examDoc = await getDocs(query(collection(db, "exams"), where("__name__", "==", examId)));
                if (examDoc.empty) throw new Error("Exam not found.");
                currentExam = { ...examDoc.docs[0].data(), _id: examId };
                if (!canReadExam(currentExam, user)) throw new Error("This exam is outside your access.");

                document.getElementById("table-exam-title").textContent = examName;
                document.getElementById("analytics-section").classList.remove("hidden");

                // Subscribe to results for this exam
                if (unsubResults) unsubResults();
                unsubResults = onSnapshot(
                    query(collection(db, "examResults"), where("examId", "==", examId)),
                    (snap) => {
                        resultsMap = {};
                        snap.docs.sort((a, b) => timestamp(a.data().updatedAt) - timestamp(b.data().updatedAt) || a.id.localeCompare(b.id))
                            .forEach(d => { if (d.data().studentDocId) resultsMap[d.data().studentDocId] = d.data(); });
                        renderScoreTable(allStudents);
                    },
                    () => showToast("Exam results could not be loaded. Reload to retry.", "error")
                );
            } catch (err) {
                showToast("Error loading exam: " + err.message, "error");
            } finally {
                setButtonLoading(btnLoad, false);
            }
        });

        // ─── Render score table ────────────────────────────────────────
        function renderScoreTable(students) {
            const search = document.getElementById("search-students")?.value?.toLowerCase() || "";
            const historical = Object.entries(resultsMap).filter(([id]) => !students.some(student => student._id === id))
                .map(([id, result]) => normalizeStudent({ ...result.studentSnapshot, _id: id,
                    name: result.studentSnapshot?.name || result.studentName || `Former student (${id})`,
                    studentId: result.studentSnapshot?.studentId || result.studentId || "", rosterDeleted: true }));
            const filtered = filterStudents([...students, ...historical], search);

            const tbody = document.getElementById("scores-tbody");
            tbody.innerHTML = filtered.map(s => {
                const r = resultsMap[s._id] || {};
                const [percentA, percentB] = portalPercentages(r);
                const scoreA = percentA ?? "";
                const scoreB = percentB ?? "";
                const best = Math.max(scoreA !== "" ? Number(scoreA) : 0, scoreB !== "" ? Number(scoreB) : 0);
                const hasBoth = scoreA !== "" && scoreB !== "";
                const passed = hasBoth && best >= PASSING_SCORE;
                const statusBadge = hasBoth
                    ? (passed ? `<span class="badge badge-green">✅ PASSED</span>` : `<span class="badge badge-red">❌ FAILED</span>`)
                    : `<span class="badge badge-gray">Pending</span>`;

                return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;">${escapeHtml((s.name || "?")[0].toUpperCase())}</div>
              <span class="fw-600">${escapeHtml(s.name || "—")}${s.rosterDeleted ? " (removed from roster)" : ""}</span>
            </div>
          </td>
          <td><span class="badge badge-gray">${escapeHtml(s.studentId || "—")}</span></td>
          <td>${escapeHtml(s.yearLevel || "—")}</td>
          <td>${escapeHtml(s.section || "—")}</td>
          <td>
            <input
              type="number" min="0" max="100"
              class="score-input" data-student="${escapeHtml(s._id)}" data-set="A" aria-label="Set A percentage"
              value="${scoreA}"
              placeholder="—"
            />
          </td>
          <td>
            <input
              type="number" min="0" max="100"
              class="score-input" data-student="${escapeHtml(s._id)}" data-set="B" aria-label="Set B percentage"
              value="${scoreB}"
              placeholder="—"
            />
          </td>
          <td>${statusBadge}</td>
          <td>
            <button class="btn btn-ghost btn-sm" data-clear="${escapeHtml(s._id)}" aria-label="Clear percentages">🗑</button>
          </td>
        </tr>
      `;
            }).join("") || `<tr><td colspan="8"><div class="empty-state" style="padding:24px 0;"><h4>No students found</h4></div></td></tr>`;

            updateAnalytics();
        }

        // Search students in score table
        document.getElementById("scores-tbody").addEventListener("change", event => {
            const input = event.target.closest("input[data-student]");
            if (input) window.saveScore(input.dataset.student, input.dataset.set, input.value);
        });
        document.getElementById("scores-tbody").addEventListener("click", event => {
            const button = event.target.closest("button[data-clear]");
            if (button) window.clearScore(button.dataset.clear);
        });
        const doSearch = debounce(() => renderScoreTable(allStudents), 250);
        document.getElementById("search-students").addEventListener("input", doSearch);

        // ─── Save score ────────────────────────────────────────────────
        window.saveScore = async (studentDocId, set, rawValue) => {
            if (!currentExam) return;
            const value = rawValue === "" ? null : Math.min(100, Math.max(0, Number(rawValue)));
            try {
                const docId = `${currentExam._id}_${studentDocId}`;
                const existing = resultsMap[studentDocId] || {};
                const [existingA, existingB] = portalPercentages(existing);
                await setDoc(doc(db, "examResults", docId), {
                    examId: currentExam._id,
                    examName: currentExam.examName,
                    subject: currentExam.subject,
                    studentDocId,
                    studentSnapshot: studentSnapshot(allStudents.find(student => student._id === studentDocId) || existing.studentSnapshot || { name: `Former student (${studentDocId})` }),
                    scoreType: "percentage",
                    uploadedByUid: user.uid,
                    uploadedByTeacherId: user.teacherId || user.instructorId || "",
                    teacherEmail: user.email,
                    scoreA: set === "A" ? value : existingA,
                    scoreB: set === "B" ? value : existingB,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                await logActivity(user, "UPDATE_SCORE", `Updated Set ${set} score for a student in ${currentExam.examName}`, {
                    entityType: "examResult",
                    entityId: docId,
                    examId: currentExam._id,
                    studentDocId,
                    set,
                    value
                });
            } catch (err) {
                showToast("Error saving score: " + err.message, "error");
            }
        };

        window.clearScore = async (studentDocId) => {
            if (!currentExam) return;
            try {
                const docId = `${currentExam._id}_${studentDocId}`;
                await setDoc(doc(db, "examResults", docId), {
                    examId: currentExam._id, studentDocId,
                    studentSnapshot: studentSnapshot(allStudents.find(student => student._id === studentDocId) || resultsMap[studentDocId]?.studentSnapshot || { name: `Former student (${studentDocId})` }),
                    scoreType: "percentage",
                    uploadedByUid: user.uid,
                    uploadedByTeacherId: user.teacherId || user.instructorId || "",
                    teacherEmail: user.email,
                    scoreA: null, scoreB: null, updatedAt: serverTimestamp()
                }, { merge: true });
                await logActivity(user, "CLEAR_SCORE", `Cleared student scores in ${currentExam.examName}`, {
                    operation: "UPDATE",
                    entityType: "examResult",
                    entityId: docId,
                    examId: currentExam._id,
                    studentDocId
                });
                showToast("Scores cleared.", "info");
            } catch (err) {
                showToast("Error: " + err.message, "error");
            }
        };

        // ─── Analytics ─────────────────────────────────────────────────
        function updateAnalytics() {
            const scores = allStudents
                .map(s => resultsMap[s._id])
                .filter(Boolean)
                .map(r => portalPercentages(r).filter(value => value !== null))
                .filter(values => values.length)
                .map(values => Math.max(...values));

            const total = allStudents.length;
            const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "—";
            const high = scores.length ? Math.max(...scores) : "—";
            const low = scores.length ? Math.min(...scores) : "—";
            const passed = scores.filter(s => s >= PASSING_SCORE).length;
            const rate = scores.length ? `${Math.round((passed / scores.length) * 100)}%` : "—";

            document.getElementById("an-total").textContent = total;
            document.getElementById("an-avg").textContent = avg;
            document.getElementById("an-high").textContent = high;
            document.getElementById("an-low").textContent = low;
            document.getElementById("an-pass").textContent = rate;
        }

    </script>
</body>

</html>
